<style>
  :root { --stone: #241517; --vault: #331d1f; --gilt: #c9a24c; --gilt-dim: #8a6d33; --bone: #ecdfc4; --bone-dim: #b8a88c; }
  body { margin: 0; min-height: 100vh; background: var(--stone); color: var(--bone); font: 1.0625rem/1.5 'Alegreya Sans', system-ui, sans-serif; }

  ul { list-style: none; padding: 0; margin: 0; display: grid; gap: .75rem; }
  a { display: block; padding: 1.1rem 1.3rem; background: var(--vault); border: 1px solid var(--gilt-dim); color: inherit; text-decoration: none; }
  a:hover { border-color: var(--gilt); }
  a:focus-visible { outline: 2px solid #4fb3a5; outline-offset: 3px; }
  b { font: 400 1.8rem 'Pirata One', serif; color: var(--bone); display: block; }
  span { color: var(--bone-dim); }
</style>
